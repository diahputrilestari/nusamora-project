name: prerender-artikel
# Membuat snapshot HTML statis tiap artikel (SEO), lalu membuka PR berisi perubahan ke prerender/artikel/.
# Jalankan manual (Actions > prerender-artikel > Run workflow) setelah menerbitkan atau mengubah artikel; juga berjalan tiap Senin.
# Setelah PR di-merge dan hPanel pull, .htaccess menyajikan snapshot itu ke pengunjung dan mesin pencari.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0"   # Minggu 19:17 UTC = Senin 02:17 WIB
permissions:
  contents: write
  pull-requests: write
concurrency: prerender-artikel
jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: landing-page }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Playwright + Chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium >/dev/null
      - name: Uji prarender (tanpa jaringan, JS mati)
        run: python3 ops/tests/prerender-artikel.ui.test.py
      - name: Buat snapshot artikel
        id: gen
        continue-on-error: true
        run: python3 ops/seo/prerender_artikel.py 2>&1 | tee "$RUNNER_TEMP/prerender.log"; exit ${PIPESTATUS[0]}
      - name: Buka PR bila ada perubahan
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prerender
          if git diff --cached --quiet; then echo "Tidak ada perubahan snapshot."; exit 0; fi
          BR="prerender/artikel-$(date -u +%Y%m%d)"
          git checkout -b "$BR"; git commit -q -m "Prarender artikel: perbarui snapshot HTML statis"; git push -q -f origin "$BR"
          SUMMARY=$(tail -1 "$RUNNER_TEMP/prerender.log")
          gh pr create --base landing-page --head "$BR" --title "Prarender artikel: perbarui snapshot ($(date -u +%Y-%m-%d))" \
            --body "Snapshot HTML statis artikel untuk SEO. $SUMMARY. Setelah merge dan hPanel pull, /artikel/<slug> melayani isi penuh tanpa JavaScript." || echo "PR sudah ada atau tidak bisa dibuat otomatis; cabang $BR sudah di-push."
      - name: Gagal bila ada artikel yang tidak ter-snapshot
        if: steps.gen.outcome == 'failure'
        run: echo "Sebagian artikel gagal di-snapshot, lihat log langkah sebelumnya."; exit 1
